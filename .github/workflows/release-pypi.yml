name: Release to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  dependency-chain:
    permissions:
      contents: read
    uses: StarGazer1995/mcp-stargazing/.github/workflows/dependency-chain-reusable.yml@main
    with:
      changed_repository: ${{ github.repository }}
      candidate_ref: ${{ github.sha }}
      baseline_ref: main
      refs_json: '{}'
      allow_known_baseline: false

  build-and-publish:
    name: Build and Publish to PyPI
    needs: dependency-chain
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC Trusted Publishing for PyPI
      contents: write   # GitHub Release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build dependencies
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes
